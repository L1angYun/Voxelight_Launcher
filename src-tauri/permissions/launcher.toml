# App-specific IPC families for the single local launcher WebView.

[[permission]]
identifier = "launcher-shell"
description = "Allow the launcher shell commands in the local main window."
commands.allow = [
  "bootstrap",
  "get_system_appearance",
  "get_launcher_background",
  "list_running_games",
  "open_folder",
]

