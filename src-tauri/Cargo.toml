[package]
name = "voxelight-launcher"
version = "0.6.0"
description = "Voxelight Launcher with a Rust core and React interface"
authors = ["Voxelight Launcher contributors"]
license = "GPL-3.0-only"
homepage = "https://github.com/L1angYun/Voxelight_Launcher"
repository = "https://github.com/L1angYun/Voxelight_Launcher"
edition = "2021"
rust-version = "1.90"

[lib]
name = "voxelight_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time", "rt-multi-thread"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fastnbt = "2"
md5 = "0.7"
uuid = { version = "1", features = ["v4"] }
# ZIP enables flate2 without selecting a codec; the direct dependency selects the Rust backend.
zip = { version = "=9.2.3", default-features = false, features = ["deflate-flate2", "deflate-zopfli"] }
regex = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
shell-words = "1"
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "System_UserProfile", "UI_ViewManagement", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Threading", "Win32_Globalization"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[profile.dev.package.ring]
debug = false
